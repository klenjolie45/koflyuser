name: flutter_restaurant
description: A new Flutter restaurant application.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.9
  get_it: ^9.2.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  dio: ^5.11.0
  http: ^1.6.0
  image_picker: ^1.2.3
  pin_code_fields: ^9.4.0
  google_maps_flutter_web: ^0.6.3
  google_maps_flutter: ^2.18.0
  geocoding: ^5.0.0
  geolocator: ^14.0.3
  shimmer_animation: ^2.2.2+1
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.1
  url_strategy: ^0.3.0
  universal_html: ^2.3.0
  image: ^4.9.1
  flutter_widget_from_html_core: ^0.17.2
  country_code_picker: ^3.4.1
  flutter_typeahead: ^6.0.0
  circular_countdown_timer: ^0.2.4
  marquee: ^2.3.0
  flutter_inappwebview: ^6.1.5
  audioplayers: ^6.8.1
  flutter_facebook_auth: ^7.2.0
  google_sign_in: ^7.2.0
  dotted_border: ^3.1.0
  share_plus: ^13.3.0
  expandable_bottom_sheet: ^1.1.1+1
  scroll_to_index: ^3.0.1
  photo_view: ^0.15.0
  cached_network_image: ^3.4.1
  just_the_tooltip: ^0.0.12
  sign_in_with_apple: ^8.1.0
  mobile_scanner: ^7.4.0
  app_links: ^7.2.1
  go_router: ^17.5.0
  firebase_auth: ^6.5.7
  flutter_svg: ^2.3.0
  flutter_staggered_grid_view: ^0.7.0
  dropdown_search: ^7.0.0
  animated_custom_dropdown: ^4.0.0
  dropdown_button2: ^3.1.0
  carousel_slider: ^5.1.2
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  dotted_line: ^3.3.0
  collection: any
  app_tracking_transparency: ^2.0.7
  skeletonizer: ^2.1.3


dev_dependencies:
  flutter_lints: ^6.0.0
  fwfh_text_style: ^2.23.8
  drift_dev: ^2.34.0
  build_runner: ^2.15.0

  flutter_test:
    sdk: flutter


flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false

  assets:
    - assets/icon/
    - assets/image/
    - assets/svg/
    - assets/language/
    - assets/json/
    - assets/payment/
    - assets/
    - web/assets/

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/NunitoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NunitoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NunitoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NunitoSans-Bold.ttf
          weight: 700

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400